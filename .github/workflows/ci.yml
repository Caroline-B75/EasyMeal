name: CI

on:
  # Sur toutes les branches, et non seulement sur main : le travail se fait sur
  # des branches de fonctionnalité (`ia`…) et doit être contrôlé là. Avec un
  # filtre sur main, rien ne se déclenchait tant qu'aucune pull request n'était
  # ouverte — la CI ne tournait donc jamais.
  push:
  pull_request:

# Une nouvelle poussée sur la même branche annule le contrôle en cours : seul le
# dernier état du code compte, et les minutes GitHub ne sont pas dépensées deux
# fois pour un état déjà dépassé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # --ensure-ignore-notes demande à Brakeman de refuser une alerte écartée
      # sans justification écrite dans config/brakeman.ignore.
      #
      # ⚠️ Vérifié le 28/08/2026 : en 8.0.6 ce drapeau n'échoue pas réellement —
      # sortie 0 même sur une note vide, et NoMethodError interne quand la clé
      # « note » est absente. Il est gardé parce qu'il énonce la règle et
      # prendra effet quand le gem sera corrigé, mais la garantie d'aujourd'hui
      # reste la relecture du fichier d'exclusions.
      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager --ensure-ignore-notes

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    # Le runner GitHub embarque PostgreSQL mais ne le démarre pas : sans ce
    # service, db:test:prepare échoue avant le premier exemple. Version alignée
    # sur le poste de développement (14), pour tester ce qu'on exécute vraiment.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # RSpec, et non `rails test` : tout le projet est testé dans spec/, alors
      # que test/ ne contient que le squelette généré par Rails. La suite n'a
      # besoin d'aucun secret — ni clé Anthropic, ni compte Cloudinary : les
      # specs les simulent (vérifié en la faisant tourner sans .env).
      - name: Run tests
        env:
          RAILS_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          bin/rails db:test:prepare
          bundle exec rspec --format RSpec::Github::Formatter --format progress
