# ─────────────────────────────────────────────────────────────────────────────
# Une découpe = un ingrédient. Un magret, une cuisse et un confit de canard ne
# s'achètent pas au même rayon, ne coûtent pas le même prix et ne se cuisinent
# pas pareil : les réunir sous un « Canard » générique rendait la liste de
# courses inutilisable (« 800 g de canard »). Les génériques qui ne désignaient
# aucun produit du rayon (Canard, Agneau, Veau, Dinde) ont donc été retirés au
# profit de leurs découpes — cf. la clé `retired` en fin de fichier.
# Les alias portent systématiquement la variante sans ligature (« boeuf ») et
# sans accent : le matcher compare des chaînes, « bœuf » et « boeuf » sont deux
# chaînes différentes.
