# =============================================================================
# Données des ingrédients de base (français)
# =============================================================================
# Chargé par db/seeds/ingredients.rb (upsert idempotent).
#
# Format d'une entrée :
#   - name:    Nom affiché (clé naturelle, unique). Obligatoire.
#     unit:    Groupe d'unités — mass | volume | count | spoon. Obligatoire.
#              La base_unit en est dérivée (mass→g, volume→ml, count→piece, spoon→cac).
#     season:  Mois de disponibilité/saison [1..12] (défaut : [] = non saisonnier).
#     aliases: Synonymes en MINUSCULES (défaut : []). Servent au matching de
#              l'import IA et à la recherche : inclure surtout pluriels + synonymes.
#
# Convention : deux conditionnements/unités réellement distincts = deux
# ingrédients séparés (ex. « Gousse d'ail » vs « Tête d'ail »).
# =============================================================================

