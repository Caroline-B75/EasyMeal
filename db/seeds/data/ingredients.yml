# =============================================================================
# Données des ingrédients de base (français)
# =============================================================================
# Chargé par db/seeds/ingredients.rb (upsert idempotent).
#
# Format d'une entrée :
#   - name:    Nom affiché (clé naturelle, unique). Obligatoire.
#     unit:    Groupe d'unités — mass | volume | count | spoon. Obligatoire.
#              La base_unit en est dérivée (mass→g, volume→ml, count→piece, spoon→cac).
#     weight:  Poids d'UNE pièce en grammes (facultatif). Fait le pont quand une
#              recette compte ce que le catalogue pèse : « 2 tranches de jambon »
#              → 80 g si weight vaut 40. À ne renseigner que là où la pièce a un
#              sens (une aubergine, une tranche, une gousse) et sur les
#              ingrédients en mass ou en count — ailleurs, l'omettre.
#     volume:  Contenu d'UNE pièce en millilitres (facultatif). Jumeau de weight
#              pour ce qui se verse : une brique de lait contient 1000. Un
#              ingrédient a l'un ou l'autre, jamais les deux.
#     piece:   Nom de la pièce à l'achat (facultatif) — et interrupteur : un
#              ingrédient qui le porte s'affiche en pièces dans la liste de
#              courses (« 2 pièces (600 g) », « 1 brique pour 3 ml »), un
#              ingrédient sans lui se pèse. À ne renseigner que là où on achète
#              la pièce ET où on la consomme à peu près entièrement : l'huile
#              s'achète en bouteille mais une recette en prend deux cuillères.
#              Demande un weight ou un volume, sauf sur un ingrédient déjà en
#              count. Deux écritures, selon ce que le pluriel réclame :
#                piece: "tranche"                → tranche / tranches
#                piece: [maquereau, maquereaux]  → pluriel explicite
#                piece: [gambas, gambas]         → invariable
#              Laissés sans piece à dessein, et pas par oubli : les ingrédients
#              de placard (huiles, vinaigres, bouillons), les alcools — un fond
#              de vin blanc afficherait « 1 bouteille pour 20 cl » —, l'épicerie
#              sèche et les surgelés en sachet (on ne finit pas le sachet, et sa
#              taille varie d'une marque à l'autre), et les fromages à la coupe.
#     density: Masse d'un millilitre, en g/ml (facultatif). Fait le pont quand une
#              recette mesure ce que le catalogue pèse : « 1 c. à s. de farine »
#              → 8,25 g si density vaut 0.55 (une c. à s. fait 15 ml). À
#              renseigner sur ce qu'on dose vraiment à la cuillère ou au verre
#              sans le peser — farines, sucres, poudres, sirops. Sans objet sur
#              les ingrédients en count. Une densité écrite ici est réputée
#              vérifiée (density_source: manual) ; celles qu'on omet peuvent être
#              estimées par l'IA à l'import, et sont alors signalées à vérifier.
#     season:  Mois de disponibilité/saison [1..12] (défaut : [] = non saisonnier).
#     aliases: Synonymes en MINUSCULES (défaut : []). Servent au matching de
#              l'import IA et à la recherche : inclure surtout pluriels + synonymes.
#
# Convention : deux conditionnements/unités réellement distincts = deux
# ingrédients séparés (ex. « Gousse d'ail » vs « Tête d'ail »).
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
