# ─────────────────────────────────────────────────────────────────────────────
# Ingrédients retirés du catalogue.
#
# Supprimer une entrée ci-dessus ne la supprime pas de la base : la seed ne fait
# qu'ajouter et mettre à jour. Sans cette liste, un générique remplacé par ses
# découpes (« Canard » → magret, cuisse, confit) survivrait indéfiniment en base
# et continuerait de sortir dans les recherches, à côté de ses remplaçants.
#
# La seed ne supprime que ce que plus aucune recette n'utilise ; sinon elle le
# signale et laisse la ligne en place, à arbitrer à la main.
retired:
  # Génériques de boucherie remplacés par leurs découpes : on n'achète pas
  # « du canard », on achète un magret ou une cuisse.
  - "Canard"
  - "Agneau"
  - "Veau"
  - "Dinde"
  - "Jarret"          # → Jarret de bœuf / Jarret de porc
  - "Pain"            # → Baguette (à la pièce) / Pain de campagne (au poids)
  - "Chèvre"          # → Bûche de chèvre / Crottin de chèvre
  # Générique trop flou : « champignons » désigne les champignons de Paris dans
  # la quasi-totalité des recettes, et les variétés ont leur propre entrée.
  - "Champignon"
  # Marques déposées ramenées au nom du produit, la marque restant en alias.
  - "Knacki"          # → Saucisse de Strasbourg
  - "Boursin"         # → Fromage ail et fines herbes
  - "Coca-Cola"       # → Cola
  - "Tabasco"         # → Sauce pimentée
  # Renommages
  - "Curry pâte massala"  # → Pâte de curry massala
  - "Galette de riz"      # → Galette de riz soufflé / Feuille de riz
